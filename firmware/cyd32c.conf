# ESP32-2432S032C (3.2" CYD, capacitive) -- use with boards/cyd32c.overlay:
#   west build ... -- -DDTC_OVERLAY_FILE=boards/cyd32c.overlay -DEXTRA_CONF_FILE=cyd32c.conf
CONFIG_BLINK_BOARD_CYD32C=y
CONFIG_ILI9341=n
CONFIG_ST7789V=y
CONFIG_INPUT_XPT2046=n
CONFIG_I2C=y
CONFIG_INPUT_GT911=y
# Polling (10 ms): independent of how the panel configures its INT pulse.
CONFIG_INPUT_GT911_INTERRUPT=n
CONFIG_INPUT_GT911_PERIOD_MS=10
# Room for the [touch] diagnostic printk in the input thread.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# The production 2.8" panels needed their backlight scaled down; this one does not.
CONFIG_BLINK_BL_SCALE_PCT=100
# Claude and Codex weekly side by side on one screen.
CONFIG_BLINK_DUAL_WEEKLY=y
